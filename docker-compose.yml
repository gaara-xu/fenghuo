services:
  fenghuo-app:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
    image: fenghuo:local
    container_name: fenghuo-app
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 18770
      DB_HOST: ${DB_HOST:-192.168.3.110}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: fenghuo
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env.docker 中配置数据库密码}
      PLAYER_ID: ${PLAYER_ID:-1}
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN:-}
    ports:
      - "${FENGHUO_BIND_IP:-0.0.0.0}:${FENGHUO_PORT:-5173}:18770"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18770/api/health',{signal:AbortSignal.timeout(4000)}).then(async r=>{const b=await r.json();process.exit(r.ok&&b.ok&&b.database==='fenghuo'?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
